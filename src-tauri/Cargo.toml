[package]
name = "credence-ai"
version = "0.1.0"
description = "Run big AI models locally on normal computers"
edition = "2021"

[lib]
name = "credence_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
